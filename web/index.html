<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101014">
<meta name="description" content="Save videos from Facebook, TikTok, YouTube and Instagram to watch later, sorted into folders.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WatchLater+">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>WatchLater+</title>
<style>
:root{
  --bg:#101014; --surface:#1a1a21; --surface2:#24242d; --line:#2f2f3a;
  --text:#f3f1ec; --muted:#9c9aa6; --accent:#ffb22e; --on-accent:#1b1404; --hot:#ff5c47;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --r:18px;
}
html[data-theme="light"]{
  --bg:#f6f3ec; --surface:#ffffff; --surface2:#efeadf; --line:#e2dccf;
  --text:#17161c; --muted:#6d6a75; --accent:#f5a516; --on-accent:#1b1404; --hot:#e2452f;
  --shadow:0 10px 30px rgba(40,30,10,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;
  overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
svg{display:block}

#app{height:100%;display:flex;flex-direction:column}
header{padding:calc(env(safe-area-inset-top) + 14px) 18px 10px;display:flex;align-items:center;gap:12px;min-height:64px}
.logo{font-weight:800;font-size:24px;letter-spacing:-.6px}
.logo b{color:var(--accent)}
.hgrow{flex:1;min-width:0}
.htitle{font-weight:800;font-size:22px;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-size:13px;color:var(--muted);font-weight:600;text-align:right;line-height:1.2}
.count strong{display:block;color:var(--accent);font-size:22px;font-weight:800;letter-spacing:-.5px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}

main{flex:1;overflow-y:auto;padding:4px 14px 120px;-webkit-overflow-scrolling:touch}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:0 14px;height:46px;margin:2px 0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;outline:0;background:none;min-width:0}
.search input::placeholder{color:var(--muted)}

.chips{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 16px;border-radius:999px;background:var(--surface);color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:var(--accent);color:var(--on-accent)}

.lay-list .item{display:grid;grid-template-columns:108px 1fr 44px;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:8px;margin-bottom:10px}
.thumb{position:relative;isolation:isolate;width:108px;height:72px;border-radius:12px;overflow:hidden;background:var(--surface2);display:block}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
.tile{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.3px}
.tile.yt{background:linear-gradient(135deg,#ff3b30,#b3150c)}
.tile.fb{background:linear-gradient(135deg,#2f7bff,#1746b8)}
.tile.tt{background:linear-gradient(135deg,#25f4ee,#111 45%,#fe2c55)}
.tile.ig{background:linear-gradient(135deg,#feda75,#d62976 55%,#4f5bd5)}
.tile.x{background:linear-gradient(135deg,#3a3a44,#0c0c10)}
.tile.web{background:linear-gradient(135deg,#6b6f80,#3b3e4b)}
.play{z-index:2;position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.play svg{width:14px;height:14px;color:#fff;margin-left:2px}
.tile .tname{position:absolute;left:8px;bottom:6px;font-size:11px;opacity:.95}
/* which app the video came from: the app's own icon from the phone, or a simple badge */
.srcb{position:absolute;z-index:3;border:1.5px solid rgba(255,255,255,.85);left:5px;top:5px;width:20px;height:20px;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;background:#6b6f80;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.srcb svg{width:62%;height:62%}
.srcb b{font:800 12px/1 system-ui,sans-serif}
.thumb .srcb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.srcb.has{background:none;border:0;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.srcb.yt{background:#e62117}.srcb.fb{background:#1b74e4}.srcb.tt{background:#111}
.srcb.ig{background:linear-gradient(135deg,#f9b23c,#e1306c 55%,#6a4ad6)}.srcb.x{background:#111}
.lay-grid .srcb,.lay-big .srcb{width:28px;height:28px;left:8px;top:8px}
.lay-grid .srcb b,.lay-big .srcb b{font-size:15px}
.body{min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:5px;text-align:left}
.body h3{margin:0;font-size:15px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.meta{margin:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .fold{color:var(--text);font-weight:600}
.acts{display:flex;flex-direction:column;gap:4px;align-items:center}
.tick{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.tick svg{width:18px;height:18px}
.more{width:40px;height:30px;display:grid;place-items:center;color:var(--muted)}
.more svg{width:20px;height:20px}
.item.done .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.item.done .thumb{filter:grayscale(1);opacity:.55}
.item.done .body{opacity:.5}

/* layout switch next to the filter chips */
.tools{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.tools .chips{flex:1;min-width:0;margin-bottom:0}
.tools .chip{padding:0 12px;font-size:13.5px}
.tools .chips{gap:6px}
.lay{display:flex;background:var(--surface);border-radius:12px;padding:3px;flex:none}
.lay button{width:36px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.lay button svg{width:18px;height:18px}
.lay button.on{background:var(--surface2);color:var(--accent)}

/* Grid (two columns, like Facebook Saved) and Big (one large card) */
#list.lay-grid{display:flex;gap:10px;align-items:flex-start}
.gcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.lay-grid .item,.lay-big .item{display:block;padding:0;overflow:hidden;margin:0;background:var(--surface);border-radius:var(--r)}
.lay-big .item{margin-bottom:14px}
.lay-grid .thumb,.lay-big .thumb{width:100%;height:auto;aspect-ratio:var(--ar);border-radius:0}
.lay-grid .play,.lay-big .play{width:44px;height:44px;margin:-22px 0 0 -22px}
.lay-grid .play svg,.lay-big .play svg{width:18px;height:18px}
.lay-grid .tile .tname,.lay-big .tile .tname{font-size:13px;left:10px;bottom:9px}
.lay-grid .body,.lay-big .body{width:100%;padding:10px 12px 2px;gap:4px}
.lay-big .body h3{font-size:16.5px}
.cfoot{display:flex;align-items:center;gap:4px;padding:2px 4px 6px 12px}
.cfoot .meta{flex:1;min-width:0}
.cfoot .tick{width:34px;height:34px;flex:none}
.cfoot .tick svg{width:16px;height:16px}
.cfoot .more{width:36px;height:36px;flex:none}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcard{background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;min-height:124px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.fcard .em{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--tint,var(--surface2))}
.fcard .nm{font-weight:800;font-size:16px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .ct{font-size:12.5px;color:var(--muted);margin-top:-4px}
.badge{position:absolute;top:12px;right:12px;min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13px;display:grid;place-items:center}
.fcard.new{border:2px dashed var(--line);background:none;align-items:center;justify-content:center;color:var(--muted);font-weight:700}
.fcard.new svg{width:26px;height:26px}

.empty{text-align:center;padding:34px 18px 10px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:8px}
.empty h2{color:var(--text);margin:0 0 6px;font-size:19px;letter-spacing:-.3px}
.steps{text-align:left;background:var(--surface);border-radius:var(--r);padding:6px 16px;margin:18px 0 0}
.steps div{display:flex;gap:12px;align-items:center;padding:11px 0;color:var(--text);font-size:14.5px}
.steps div+div{border-top:1px solid var(--line)}
.steps i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;display:grid;place-items:center;flex:none;font-size:14px}

.btn{height:50px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:800;padding:0 18px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:none;color:var(--hot);border:2px solid var(--line)}
.btn+.btn{margin-top:10px}
.btn svg{width:20px;height:20px;flex:none}

.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.small{font-size:13px;color:var(--muted)}

footer{text-align:center;font-size:11px;color:var(--muted);padding:22px 10px 6px;line-height:1.5}

nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:6px 10px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:700}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent)}
#fab{position:fixed;z-index:11;right:16px;bottom:calc(env(safe-area-inset-bottom) + 78px);width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow)}
#fab svg{width:26px;height:26px}
#fab[hidden]{display:none}

#sheetwrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end}
#sheetwrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#sheet{position:relative;width:100%;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
#sheet h2{margin:0 0 4px;font-size:20px;letter-spacing:-.3px}
#sheet .sub{margin:0 0 14px;color:var(--muted);font-size:13.5px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;text-align:left;font-weight:600;font-size:16px;border-radius:12px;padding:0 6px}
.row svg{width:22px;height:22px;color:var(--muted);flex:none}
.row.hot,.row.hot svg{color:var(--hot)}
.field{width:100%;height:50px;border-radius:14px;border:2px solid var(--line);background:var(--bg);padding:0 14px;outline:0;margin-bottom:12px}
.field:focus{border-color:var(--accent)}
textarea.field{height:auto;min-height:96px;padding:12px 14px;resize:none;line-height:1.4;font-size:14.5px}
.help{font-size:12.5px;color:var(--muted);margin:-6px 2px 12px}
.line{display:flex;align-items:center;gap:12px}
.pasterow{display:flex;gap:8px}.pasterow .field{flex:1;min-width:0}.pasterow .btn{width:auto;height:50px;flex:none;padding:0 16px}
.line .grow{flex:1;min-width:0}
.line .seg{width:132px;flex:none}
.card .field{margin:12px 0 0}
.card .btn{margin-top:12px}
.card .small{margin:10px 0 0}
.dbg{font-size:11.5px;color:var(--muted);margin:12px 4px 0;line-height:1.45;word-break:break-word}
.note2{font-size:12.5px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#askbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);background:var(--text);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;z-index:15;box-shadow:var(--shadow)}
#askbar[hidden]{display:none}
#askbar span{flex:1}
#askbar button{height:40px;padding:0 14px;border-radius:11px;font-weight:800;font-size:14px;color:var(--bg);border:2px solid rgba(128,128,128,.45)}
#askbar button.yes{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px 2px;text-transform:uppercase;letter-spacing:.6px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.pick button{min-height:52px;border-radius:14px;background:var(--surface2);padding:0 12px;text-align:left;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:2px solid transparent}
.pick button.on{border-color:var(--accent)}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:14px}
.emo button{aspect-ratio:1;border-radius:10px;background:var(--surface2);font-size:20px;border:2px solid transparent}
.emo button.on{border-color:var(--accent)}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translateX(-50%) translateY(12px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="main"></main>
</div>
<nav id="nav"></nav>
<button id="fab" data-act="add" aria-label="Add a link"></button>
<div id="sheetwrap" hidden><div class="backdrop" data-act="close"></div><section id="sheet" role="dialog" aria-modal="true"></section></div>
<div id="askbar" hidden><span>Did you watch it?</span><button class="yes" data-act="ask-yes">Yes, done</button><button data-act="ask-no">Not yet</button></div>
<div id="toast" role="status"></div>

<script>
'use strict';
/* WatchLater+ : Part 2. Home list, folders, add / move / rename / delete, watched ticks,
   plus previews (title + thumbnail), notes, auto-sort words, reminders.
   On the phone, data lives in the app (shared with the Share popup) through WLNative.
   In a normal browser it falls back to localStorage so the page can be previewed. */
const N = window.WLNative || null;
/* The web version (Netlify, iPhone): no phone bridge, opened from a real web address. */
const WEB = !N && /^https?:$/.test(location.protocol);
const LS_KEY = 'watchlater_plus_v1';
const VERSION = WEB ? 'Web version' : 'Part 2 + floating button';
const EMOJI = ['🍔','🎤','🏀','😂','📁','🎬','🎵','⚽','🏋️','✈️','🐶','🎮','💡','🛠️','📚','💄','🚗','🧒','💰','🙏','🩺','💃','🎣','⭐'];
const TINTS = ['#ffb22e33','#ff5c4733','#4f8cff33','#3ecf8e33','#b98bff33','#ff8ad133','#35c9d633','#c9c13a33'];

const IC = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>',
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2.5h8.5A1.5 1.5 0 0 1 21 10v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10.5-10.5-4-4L4 16z"/><path d="m13 7 4 4"/></svg>',
  move:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2.5h8.5A1.5 1.5 0 0 1 21 10v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z"/><path d="M10 14h5M13 11.5l2.5 2.5-2.5 2.5"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.5"/><circle cx="17.5" cy="6" r="2.5"/><circle cx="17.5" cy="18" r="2.5"/><path d="m8.2 10.8 7-3.6M8.2 13.2l7 3.6"/></svg>',
  vlist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><rect x="3" y="4.5" width="3" height="3" rx=".8" fill="currentColor" stroke="none"/><rect x="3" y="10.5" width="3" height="3" rx=".8" fill="currentColor" stroke="none"/><rect x="3" y="16.5" width="3" height="3" rx=".8" fill="currentColor" stroke="none"/></svg>',

const SORT = (() => {
  const STOP = new Set(('the and for with this that you your how from what when why who are was were will can not but all any out '
    + 'our his her him she they them their its has have had just now new one two get got see too very more most '
    + 'into over here there then than about after before back best top full part official video videos reel reels '
    + 'watch short shorts clip clips post story live views view likes like share shares comments comment follow '
    + 'facebook youtube tiktok instagram twitter com www http https '
    + 'ang mga nang para lang naman yung ito iyan kung hindi ako ikaw siya niya nila namin natin din rin pag may '
    + 'wala ano sino saan kasi daw raw pala talaga sobra grabe').split(' '));
  const BIG = ['facebook.com','fb.watch','fb.com','fb.gg','youtube.com','youtu.be','tiktok.com','instagram.com','x.com','twitter.com','t.co'];
  const LKEY = 'watchlater_learned';
  const norm = s => ' ' + String(s||'').toLowerCase().replace(/https?:\/\/\S+/g,' ').replace(/[^\p{L}\p{N}]+/gu,' ').trim() + ' ';
  function tokens(s){
    const out = [];
    for(const w of norm(s).trim().split(' ')){
      if(w.length < 3 || w.length > 30 || STOP.has(w) || /^\d+$/.test(w) || out.includes(w)) continue;
      out.push(w); if(out.length >= 40) break;
    }
    return out;
  }
  function hostToken(url){
    let h = ''; try{ h = new URL(url).hostname.toLowerCase(); }catch(e){ return ''; }
    h = h.replace(/^(www|m|web|mobile|vm|vt)\./,'');
    if(!h.includes('.') || BIG.some(b => h===b || h.endsWith('.'+b))) return '';
    return '@' + h;
  }
  function has(text, key){
    const k = norm(key).trim(); if(k.length < 2) return false;
    if(text.includes(' '+k+' ')) return true;
    if(k.includes(' ')) return false;
    return text.includes(' '+k+'s ') || text.includes(' '+k+'es ');
  }
  function load(){ try{ const o = JSON.parse(localStorage.getItem(LKEY) || '{}'); return o && typeof o==='object' ? o : {}; }catch(e){ return {}; } }
  function suggest(text, url, folders){
    const t = norm(text), toks = tokens(text), ht = hostToken(url), learned = load();
    if(ht) toks.push(ht);
    if(!t.trim() && !ht) return null;
    let bestId = '', best = 0, second = 0;
    for(const f of folders){
      if(!f || !f.id || f.id==='other') continue;
      let score = 0; const seen = new Set();
      for(const w of (Array.isArray(f.words) ? f.words : [])){ const k = norm(w).trim(); if(!k || seen.has(k)) continue; seen.add(k); if(has(t,k)) score += 3; }
      for(const w of norm(f.name).trim().split(' ')){ if(w.length < 3 || STOP.has(w) || seen.has(w)) continue; seen.add(w); if(has(t,w)) score += 3; }
      for(const tok of toks){
        const m = learned[tok]; if(!m) continue;
        const mine = m[f.id] || 0; if(mine < 2) continue;
        const total = Object.values(m).reduce((a,b) => a + (Number(b)||0), 0);
        if(mine*10 >= total*6) score += Math.min(mine,4) * 0.75;
      }
      if(score > best){ second = best; best = score; bestId = f.id; } else if(score > second) second = score;
    }
    if(best < 1.5 || best <= second) return null;
    return {id:bestId, sure: best >= 3 && best - second >= 1.5};
  }
  function learn(text, url, folderId, weight){
    if(!folderId || folderId==='other') return;
    const learned = load(); let toks = tokens(text).slice(0,25); const ht = hostToken(url); if(ht) toks.push(ht);
    for(const tok of toks){ const m = learned[tok] || (learned[tok] = {}); m[folderId] = Math.min(99, (m[folderId]||0) + Math.max(1, weight||1)); }
    let keys = Object.keys(learned);
    if(keys.length > 3000) keys.forEach(k => { const tot = Object.values(learned[k]).reduce((a,b)=>a+b,0); if(tot <= 1) delete learned[k]; });
    try{ localStorage.setItem(LKEY, JSON.stringify(learned)); }catch(e){}
  }
  return {suggest, learn, tokens, hostToken};
})();

    else if(h==='youtube.com' || h.endsWith('.youtube.com')){
      id = u.searchParams.get('v') || '';
      if(!id){ const m = u.pathname.match(/^\/(shorts|live|embed)\/([\w-]+)/); if(m) id = m[2]; }

/* ---------- sheets ---------- */
let sheetOpen = false;
function sheet(html){ $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheetwrap').hidden = false; $('#sheet').scrollTop = 0; sheetOpen = true; }
function closeSheet(){ $('#sheetwrap').hidden = true; $('#sheet').innerHTML = ''; sheetOpen = false; if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
function pickHtml(sel){
  return '<div class="pick">' + data.folders.map(f => '<button data-act="pick" data-id="'+esc(f.id)+'" class="'+(f.id===sel?'on':'')+'">'+esc(f.emoji||'📁')+' '+esc(f.name)+'</button>').join('') + '</div>';
}
function item(id){ return data.items.find(i => i.id===id); }

function menuSheet(id){
  const it = item(id); if(!it) return;
  const r = (act,ic,l,cls) => '<button class="row '+(cls||'')+'" data-act="'+act+'" data-id="'+esc(id)+'">'+ic+l+'</button>';

    + r('open',IC.play,'Watch now')
    + r('toggle',IC.check, it.watched ? 'Mark as not watched' : 'Mark as watched')

    + r('m-rename',IC.edit,'Rename / add a note')
    + (N ? r('m-refresh',IC.search,'Get the preview again') : '')

    + r('m-delete',IC.trash,'Delete','hot')
    + (check ? '<p class="dbg">'+esc(check)+'</p>' : ''));
}
function moveSheet(id){
  const it = item(id); if(!it) return;

function renameSheet(id){

function deleteSheet(id){

    + '<button class="btn danger" data-act="do-delete" data-id="'+esc(id)+'">Yes, delete</button><button class="btn ghost" data-act="close">Keep it</button>');

let addFolder = 'other', addPicked = false;
function addSheet(){
  addFolder = st.view==='folder' ? st.folderId : 'other'; addPicked = st.view==='folder';
  sheet('<h2>Add a video link</h2><p class="sub">Paste a link here, or use Share in any app.</p>'
    + '<label class="lbl" for="f-url">Link</label>'
    + (navigator.clipboard && navigator.clipboard.readText ? '<div class="pasterow"><input class="field" id="f-url" type="url" inputmode="url" placeholder="https://..." autocomplete="off"><button class="btn ghost" data-act="paste">Paste</button></div>'
      : '<input class="field" id="f-url" type="url" inputmode="url" placeholder="https://..." autocomplete="off">')

    + '<button class="btn" data-act="save-add">Save</button>');
}
/* While adding a link by hand: preselect the folder its words point to (until you pick one yourself). */
function addSuggest(){
  if(addPicked || !autoSortOn()) return;
  const u = $('#f-url'), n = $('#f-name'); if(!u || !n) return;
  const s = suggest(n.value, fixUrl(u.value)); if(!s || !data.folders.some(f => f.id===s.id)) return;
  addFolder = s.id;
  document.querySelectorAll('#sheet [data-add] button').forEach(b => b.classList.toggle('on', b.dataset.id===s.id));
  const l = $('#f-flbl'); if(l) l.textContent = 'Folder · looks like ' + folder(s.id).name;
}
let editEmoji = '📁';
function folderSheet(id){
  const f = id ? data.folders.find(x => x.id===id) : null;
  editEmoji = f ? (f.emoji || '📁') : '📁';
  const list = EMOJI.includes(editEmoji) ? EMOJI : [editEmoji].concat(EMOJI.slice(0, EMOJI.length-1));
  sheet('<h2>'+(f ? 'Edit folder' : 'New folder')+'</h2><p class="sub">'+(f ? 'Change the name or icon.' : 'Name it and pick an icon.')+'</p>'
    + '<label class="lbl" for="f-fname">Name</label><input class="field" id="f-fname" maxlength="30" placeholder="e.g. Travel" value="'+esc(f ? f.name : '')+'" autocomplete="off">'
    + '<span class="lbl">Icon</span><div class="emo">'+list.map(e => '<button data-act="emoji" data-e="'+esc(e)+'" class="'+(e===editEmoji?'on':'')+'">'+e+'</button>').join('')+'</div>'
    + ((!f || f.id!=='other') ? '<label class="lbl" for="f-words">Auto-sort words</label><textarea class="field" id="f-words" maxlength="1500" placeholder="e.g. travel, vlog, beach, hotel" autocomplete="off">'+esc(f && Array.isArray(f.words) ? f.words.join(', ') : '')+'</textarea>'
        + '<p class="help">A video with any of these words in its title goes into this folder by itself. Separate words with commas.</p>' : '')
    + '<button class="btn" data-act="save-folder" data-id="'+esc(id||'')+'">Save</button>'
    + (f && f.id!=='other' ? '<button class="btn danger" data-act="del-folder" data-id="'+esc(f.id)+'">Delete folder</button>' : ''));
  if(!f) $('#f-fname').focus();
}
function delFolderSheet(id){
  const f = data.folders.find(x => x.id===id); if(!f) return;
  const n = data.items.filter(i => i.folderId===id).length;
  sheet('<h2>Delete "'+esc(f.name)+'"?</h2><p class="sub">'+(n ? 'Its '+n+(n===1?' video moves':' videos move')+' to Other. Nothing is lost.' : 'The folder is empty.')+'</p>'
    + '<button class="btn danger" data-act="do-del-folder" data-id="'+esc(id)+'">Yes, delete folder</button><button class="btn ghost" data-act="close">Keep it</button>');

/* ---------- actions ---------- */
let askId = '', askT = 0, askArmed = '';
function askWatched(){
  const it = item(askArmed); askArmed = '';
  if(!it || it.watched) return;
  askId = it.id; $('#askbar').hidden = false;
  clearTimeout(askT); askT = setTimeout(hideAsk, 12000);
}
function hideAsk(){ askId = ''; clearTimeout(askT); $('#askbar').hidden = true; }
function parseWords(v){
  const out = [];
  String(v||'').split(/[,\n;]+/).forEach(w => { w = w.trim().toLowerCase().replace(/\s+/g,' '); if(w.length>1 && w.length<=30 && !out.includes(w) && out.length<120) out.push(w); });
  return out;
}
function openItem(id){
  const it = item(id); if(!it) return;
  if(!/^https?:\/\//i.test(it.url)){ toast('This one has no link'); return; }
  if(!it.watched) askArmed = id;
  if(N){ try{ N.openUrl(it.url); }catch(e){ toast('Could not open'); } }
  else window.open(it.url, '_blank', 'noopener');
}
function demo(){
  const now = Date.now(), H = 3600000;
  const rows = [
    ['https://www.facebook.com/reel/1203948571','Crispy pork belly, 3 ingredients','food',0.3,false],
    ['https://youtu.be/wl-demo-0001','Jokic 40-point triple double vs Lakers | Full highlights','basketball',2,false],
    ['https://www.tiktok.com/@cover.sessions/video/7301','She sang "Bakit Pa" and the whole mall stopped','singing',5,false],
    ['https://www.facebook.com/share/r/1AbCdEfGh/','','other',9,false],
    ['https://www.instagram.com/reel/C9xYz12/','Dad jokes that actually landed','funny',26,true],
    ['https://youtu.be/wl-demo-0002','How to make chicken inasal at home','food',50,false],
    ['https://www.youtube.com/shorts/wl-demo-03','Curry from the logo, again','basketball',75,true]
  ];
  mutate(d => { rows.forEach((r,i) => d.items.push({id:uid('v')+i, url:r[0], title:r[1], folderId:r[2], addedAt:now - r[3]*H, watched:r[4]})); });
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act;
  const holder = el.dataset.id !== undefined ? el : el.closest('[data-id]');
  const id = holder ? holder.dataset.id : '';
  switch(act){
    case 'nav': st.view = el.dataset.v; st.q = ''; st.filter = 'all'; render(); $('#main').scrollTop = 0; break;
    case 'back': st.view = 'folders'; st.q = ''; st.filter = 'all'; render(); break;
    case 'filter': st.filter = el.dataset.k; render(); break;
    case 'layout': mutate(d => { d.settings.layout = el.dataset.k; }); break;
    case 'folder': st.view = 'folder'; st.folderId = id; st.q = ''; st.filter = 'all'; render(); $('#main').scrollTop = 0; break;
    case 'open': closeSheet(); openItem(id); break;
    case 'toggle': closeSheet(); mutate(d => { const it = d.items.find(i => i.id===id); if(it) it.watched = !it.watched; }); break;
    case 'menu': menuSheet(id); break;
    case 'close': incPending = null; closeSheet(); break;
    case 'add': addSheet(); break;
    case 'paste': {
      navigator.clipboard.readText().then(t => {
        const u = fixUrl(t); if(!u){ toast('No link copied yet'); return; }
        const f = $('#f-url'), n = $('#f-name'); if(!f) return;
        f.value = u;
        const rest = String(t).replace(/https?:\/\/\S+/i,'').trim();
        if(n && !n.value && rest) n.value = cleanShared(rest).slice(0,200);
        addSuggest();
      }).catch(() => toast('Allow pasting, or long-press the box and tap Paste'));
      break;
    }
    case 'demo': demo(); break;
    case 'theme': mutate(d => { d.settings.theme = el.dataset.k; }); break;
    case 'autosort': mutate(d => { d.settings.autoSort = el.dataset.k==='on'; }); break;
    case 'bubble': {
      const on = el.dataset.k==='on';
      if(on && !N){ toast('The floating button works in the phone app'); break; }
      mutate(d => { d.settings.bubble = on; });
      try{ if(N) N.setBubble(on); }catch(err){}
      break;
    }
    case 'remind': {
      const on = el.dataset.k==='on';
      if(on && !N){ toast('Reminders work in the phone app'); break; }
      mutate(d => { const r = remindCfg(); d.settings.remind = {on, h:r.h, m:r.m}; });
      try{ if(N) N.remindersChanged(on); }catch(err){}
      break;
    }
    case 'test-remind': try{ if(N) N.testReminder(); }catch(err){} break;
    case 'ask-yes': { const vid = askId; hideAsk(); mutate(d => { const it = d.items.find(i => i.id===vid); if(it) it.watched = true; }); toast('Marked as watched'); break; }
    case 'ask-no': hideAsk(); break;
    case 'm-refresh': closeSheet(); try{ N.refreshPreview(id); toast('Getting the preview…'); }catch(err){} break;
    case 'sort-other': {
      let moved = 0;
      mutate(d => { d.items.forEach(it => {
        if(it.folderId!=='other') return;
        const g = suggest(textOf(it), it.url);
        if(g && g.sure && d.folders.some(f => f.id===g.id)){ it.folderId = g.id; it.manual = false; moved++; }
      }); });
      toast(moved ? 'Moved ' + moved + (moved===1 ? ' video' : ' videos') : 'No clear match yet. Add words to your folders.');
      break;
    }
    case 'm-move': moveSheet(id); break;
    case 'm-rename': renameSheet(id); break;
    case 'm-delete': deleteSheet(id); break;
    case 'm-share': {
      const it = item(id); closeSheet(); if(!it) break;
      const text = (it.title ? titleOf(it) + '\n' : '') + it.url;
      if(N){ try{ N.shareText(text); }catch(err){ toast('Could not share'); } }
      else if(navigator.share) navigator.share({text}).catch(() => {});
      else toast('Sharing works in the phone app');
      break;
    }
    case 'pick': {
      const mv = el.closest('[data-move]');
      if(el.closest('[data-inc]')){ closeSheet(); if(incPending) saveIncoming(incPending.url, incPending.title, id); break; }
      if(mv){
        const vid = mv.dataset.move, f = folder(id); closeSheet();
        const before = item(vid);
        mutate(d => { const it = d.items.find(i => i.id===vid); if(it){ it.folderId = id; it.manual = true; } });
        /* you moved it by hand: remember, so similar videos go there next time */
        if(before && id!=='other') learnIt(textOf(before), before.url, id);
        toast('Moved to ' + f.name);
      } else {
        addFolder = id; addPicked = true;
        el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b===el));
      }
      break;
    }
    case 'save-rename': {
      const v = $('#f-title').value.trim(); closeSheet();
      mutate(d => { const it = d.items.find(i => i.id===id); if(it) it.note = (v===cleanShared(it.title)) ? '' : v; });
      break;
    }
    case 'do-delete':
      closeSheet(); mutate(d => { d.items = d.items.filter(i => i.id!==id); });
      try{ if(N) N.dropPreview(id); }catch(err){}
      toast('Deleted'); break;
    case 'save-add': {
      const url = fixUrl($('#f-url').value), name = $('#f-name').value.trim();
      if(!url){ toast('Paste a link first'); $('#f-url').focus(); break; }
      const f = folder(addFolder); closeSheet();
      mutate(d => {
        const old = d.items.find(i => i.url===url);
        if(old){ old.folderId = f.id; old.addedAt = Date.now(); old.watched = false; old.manual = addPicked; if(name) old.note = name; }
        else d.items.push({id:uid('v'), url, title:name, folderId:f.id, addedAt:Date.now(), watched:false, manual:addPicked});
      });
      try{
        if(addPicked && f.id!=='other') learnIt(name, url, f.id);
        if(N) N.fetchPreviews();
      }catch(err){}
      toast('Saved to ' + f.name);
      break;
    }
    case 'folder-new': incPending = null; folderSheet(''); break;
    case 'new-from-inc': folderSheet(''); break;
    case 'folder-edit': folderSheet(id); break;
    case 'emoji': editEmoji = el.dataset.e; el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b===el)); break;
    case 'save-folder': {
      const name = $('#f-fname').value.trim();
      if(!name){ toast('Give the folder a name'); $('#f-fname').focus(); break; }
      const clash = data.folders.find(f => f.name.toLowerCase()===name.toLowerCase() && f.id!==id);
      if(clash){ toast('You already have a folder called ' + clash.name); break; }
      const wEl = $('#f-words'), words = wEl ? parseWords(wEl.value) : null;
      closeSheet();
      mutate(d => {
        const f = id ? d.folders.find(x => x.id===id) : null;
        if(f){ f.name = name; f.emoji = editEmoji; if(words) f.words = words; }
        else { const at = d.folders.findIndex(x => x.id==='other'); d.folders.splice(at < 0 ? d.folders.length : at, 0, {id:uid('f'), name, emoji:editEmoji, words:words||[]}); }
      });
      if(!id && incPending){ const nf = data.folders.find(f => f.name===name); if(nf){ saveIncoming(incPending.url, incPending.title, nf.id); break; } }
      toast(id ? 'Folder updated' : 'Folder added');
      break;
    }
    case 'del-folder': delFolderSheet(id); break;
    case 'do-del-folder':
      closeSheet(); st.view = 'folders';
      mutate(d => { d.items.forEach(i => { if(i.folderId===id) i.folderId = 'other'; }); d.folders = d.folders.filter(f => f.id!==id); });
      toast('Folder deleted');
      break;
  }
});
document.addEventListener('input', e => { if(e.target.id==='q'){ st.q = e.target.value; renderList(); } });
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id==='f-url' || t.id==='f-name') addSuggest();
  if(t.id==='f-time'){
    const m = String(t.value).match(/^(\d{1,2}):(\d{2})/); if(!m) return;
    mutate(d => { d.settings.remind = {on:true, h:Math.min(23, +m[1]), m:Math.min(59, +m[2])}; });
    try{ if(N) N.remindersChanged(true); }catch(err){}
    toast('Reminder set');
  }
});
document.addEventListener('keydown', e => {
  if(e.key!=='Enter') return;
  const map = {'f-title':'save-rename','f-url':'save-add','f-name':'save-add','f-fname':'save-folder'};
  const act = map[e.target.id]; if(!act) return;
  const b = document.querySelector('#sheet [data-act="'+act+'"]'); if(b) b.click();
});

/* ---------- phone hooks ---------- */
/* Back button: close a sheet, leave a folder, or go Home. Returns false when the app should close. */
window.WLBack = function(){
  if(sheetOpen){ closeSheet(); return true; }
  if(st.view==='folder'){ st.view = 'folders'; render(); return true; }
  if(st.view!=='home'){ st.view = 'home'; render(); return true; }
  return false;
};
/* Coming back to the app: pick up anything saved from the Share popup meanwhile. */
window.WLResume = function(){
  if(askArmed) askWatched();
  try{ if(N && N.fetchPreviews) N.fetchPreviews(); }catch(e){}
  if(sheetOpen) return;
  const a = document.activeElement; if(a && (a.id==='q' || a.id==='f-time')) return;
  data = loadData(); pv = loadPv(); appIc = loadIcons(); render();
};
/* A title or thumbnail arrived in the background. */
window.WLPreviews = function(){ pv = loadPv(); renderList(); };
/* The reminder was tapped: open the list of videos still to watch. */
window.WLShow = function(list){
  closeSheet(); st.view = 'home'; st.q = ''; st.filter = list==='towatch' ? 'towatch' : 'all';
  data = loadData(); pv = loadPv(); render(); $('#main').scrollTop = 0;
};
/* Notifications are blocked for the app: switch the reminder back off and say why. */
window.WLNotifyDenied = function(){
  mutate(d => { const r = remindCfg(); d.settings.remind = {on:false, h:r.h, m:r.m}; });
  toast('Allow notifications for WatchLater+ in your phone settings first');
};
/* "Appear on top" was not allowed: switch the floating button back off and say why. */
window.WLBubbleDenied = function(){
  mutate(d => { d.settings.bubble = false; });
  toast('Allow "Appear on top" for WatchLater+ first');
};
/* ---------- web version: a link sent in from outside ---------- */
/* Android (installed web app) Share menu sends ?title=&text=&url=; the iPhone shortcut sends ?add=<link>. */
let incPending = null;
function incoming(){
  if(N) return;
  let q; try{ q = new URLSearchParams(location.search); }catch(e){ return; }
  const raw = ['add','url','text','title'].map(k => q.get(k)).filter(Boolean).join(' ').trim();
  if(!raw) return;
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
  const url = fixUrl(raw);
  if(!url){ toast('No link found in what was shared'); return; }
  const title = cleanShared(raw.replace(/https?:\/\/\S+/gi,' ').replace(/\s+/g,' ').trim()).slice(0, 200);
  saveIncoming(url, title, '');
}
/* Save it: to the folder you picked, the folder it already had, or the one auto-sort is sure of. Else ask. */
function saveIncoming(url, title, picked){
  const old = data.items.find(i => i.url===url);
  const g = (!picked && !old && autoSortOn()) ? suggest(title, url) : null;
  const fid = picked || (old && old.folderId) || (g && g.sure && data.folders.some(f => f.id===g.id) ? g.id : '');
  if(!fid){
    incPending = {url, title};
    const hint = g && data.folders.some(f => f.id===g.id) ? g.id : '';
    sheet('<h2>Save to which folder?</h2><p class="sub">'+esc(title || url)+'</p><div data-inc="1">'+pickHtml(hint)+'</div>'
      + '<button class="btn ghost" data-act="new-from-inc">'+IC.plus+'New folder</button>');
    return;
  }
  incPending = null;
  let id = old ? old.id : uid('v');
  mutate(d => {
    const o = d.items.find(i => i.url===url);
    if(o){ o.addedAt = Date.now(); o.watched = false; if(picked){ o.folderId = picked; o.manual = true; } if(title && !o.title) o.title = title; id = o.id; }
    else d.items.push({id, url, title, folderId:fid, addedAt:Date.now(), watched:false, manual:!!picked});
  });
  if(picked && picked!=='other' && title) learnIt(title, url, picked);
  const f = folder(fid);
  st.view = 'home'; st.filter = 'all'; st.q = ''; render();
  sheet('<h2>'+(old ? 'Already saved · ' : 'Saved to ')+esc(f.emoji||'📁')+' '+esc(f.name)+'</h2><p class="sub">'+esc(title || url)+'</p>'
    + '<button class="btn" data-act="close">Done</button><button class="btn ghost" data-act="m-move" data-id="'+esc(id)+'">Change folder</button>');
}
if(!N) document.addEventListener('visibilitychange', () => { if(!document.hidden && askArmed) askWatched(); });
try{ if(N && N.fetchPreviews) N.fetchPreviews(); }catch(e){}

render();
incoming();
</script>
<script>
/* Web version: keep a copy of the app on the phone so it opens with no internet. */
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
/* Ask the browser not to clear the saved list when the phone is low on space. */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
